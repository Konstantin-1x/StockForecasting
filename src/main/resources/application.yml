spring:
  application:
    name: StockForecasting
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockforecasting}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

wb:
  parser:
    promotions-url: ${WB_PROMOTIONS_URL:https://static-basket-01.wbbasket.ru/vol0/data/promotions/rubli-za-otzyvy-v3.json}
    cookie-file: ${WB_COOKIE_FILE:cookie.txt}
    max-categories: ${WB_MAX_CATEGORIES:0}
    max-pages-per-category: ${WB_MAX_PAGES_PER_CATEGORY:0}
    request-timeout: ${WB_REQUEST_TIMEOUT:20s}
    request-delay: ${WB_REQUEST_DELAY:400ms}
    user-agent: ${WB_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:150.0) Gecko/20100101 Firefox/150.0}
    spa-version: ${WB_SPA_VERSION:14.8.1}
    device-id: ${WB_DEVICE_ID:}
    continuous-scan-enabled: ${WB_CONTINUOUS_SCAN_ENABLED:true}
    monitoring-enabled: ${WB_MONITORING_ENABLED:true}
    baseline-on-startup: ${WB_BASELINE_ON_STARTUP:true}
    scan-parallelism: ${WB_SCAN_PARALLELISM:150}
    monitor-batch-size: ${WB_MONITOR_BATCH_SIZE:150}
    scan-initial-delay-ms: ${WB_SCAN_INITIAL_DELAY_MS:900000}
    scan-fixed-delay-ms: ${WB_SCAN_FIXED_DELAY_MS:900000}
    monitor-initial-delay-ms: ${WB_MONITOR_INITIAL_DELAY_MS:30000}
    monitor-fixed-delay-ms: ${WB_MONITOR_FIXED_DELAY_MS:60000}
    product-measurement-delay: ${WB_PRODUCT_MEASUREMENT_DELAY:1h}
    product-rate-limit-retry-delay: ${WB_PRODUCT_RATE_LIMIT_RETRY_DELAY:1m}
