<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, active, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Промо Прогноз'">Промо Прогноз</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v='20260517-2')}">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand__title">Промо Прогноз</div>
            <div class="brand__subtitle">Spring Boot + PostgreSQL</div>
        </div>

        <nav class="nav">
            <a th:if="${!authenticated || adminUser}"
               th:href="@{/}" class="nav__link"
               th:classappend="${active == 'home'} ? ' nav__link--active'">Стартовая</a>
            <th:block th:if="${authenticated && !adminUser}">
                <a th:href="@{/app}" class="nav__link" th:classappend="${active == 'user'} ? ' nav__link--active'">Кабинет продавца</a>
                <a th:href="@{/app/products}" class="nav__link" th:classappend="${active == 'user-products'} ? ' nav__link--active'">Товары</a>
                <a th:href="@{/app/forecasts}" class="nav__link" th:classappend="${active == 'user-forecasts'} ? ' nav__link--active'">Прогнозирование</a>
                <a th:href="@{/app/profile/edit}" class="nav__link" th:classappend="${active == 'user-profile'} ? ' nav__link--active'">Профиль продавца</a>
            </th:block>
            <th:block th:if="${adminUser}">
                <a th:href="@{/admin}" class="nav__link" th:classappend="${active == 'admin'} ? ' nav__link--active'">Админ-панель</a>
                <a th:href="@{/admin/users}" class="nav__link" th:classappend="${active == 'users'} ? ' nav__link--active'">Пользователи</a>
                <a th:href="@{/admin/offers}" class="nav__link" th:classappend="${active == 'offers'} ? ' nav__link--active'">Предложения WB</a>
                <a th:href="@{/admin/products}" class="nav__link" th:classappend="${active == 'products'} ? ' nav__link--active'">Товары продавцов</a>
                <a th:href="@{/admin/forecasts}" class="nav__link" th:classappend="${active == 'forecasts'} ? ' nav__link--active'">Нейропрогнозы</a>
            </th:block>
        </nav>

        <div class="sidebar-tools" th:if="${adminUser}">
            <div class="sidebar-tools__label">Сервис</div>
            <a class="nav__link nav__link--tool" th:href="@{/api/parser/wildberries/diagnostics}">Диагностика</a>
        </div>

        <div class="sidebar__footer">2026 Промо Прогноз</div>
    </aside>

    <div class="content">
        <header class="topbar">
            <div class="topbar__inner">
                <div class="topbar__title" th:text="${title}">Панель</div>
                <div class="topbar__actions">
                    <a class="btn" th:if="${!authenticated}" th:href="@{/login}">Войти</a>
                    <form class="logout-form" th:if="${authenticated}" th:action="@{/logout}" method="post">
                        <span class="topbar__user" th:text="${currentUsername}">admin</span>
                        <input th:if="${_csrf != null}" type="hidden"
                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn--soft" type="submit">Выйти</button>
                    </form>
                </div>
            </div>
        </header>

        <main class="page">
            <div th:if="${status}" class="alert alert--ok" th:text="${status}"></div>
            <div th:if="${error}" class="alert alert--bad" th:text="${error}"></div>
            <th:block th:replace="${content}"></th:block>
        </main>
    </div>
</div>
</body>
</html>
