<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация - Промо Прогноз</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v='20260614-2')}">
</head>
<body class="public-page">
<main class="auth-shell auth-shell--wide">
    <section class="auth-card">
        <div class="auth-card__header">
            <div class="public-kicker">Регистрация</div>
            <h1>Создание аккаунта</h1>
            <p>Создайте учетную запись. Данные продавца можно заполнить после входа в личном кабинете.</p>
        </div>

        <form class="auth-form" th:action="@{/register}" th:object="${registrationForm}" method="post">
            <input th:if="${_csrf != null}" type="hidden"
                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert--bad form-wide"
                 th:each="err : ${#fields.globalErrors()}" th:text="${err}">Ошибка регистрации</div>

            <label class="field-group">
                <span class="field-label">Логин</span>
                <input class="text-input" type="text" th:field="*{username}" required>
            </label>
            <label class="field-group">
                <span class="field-label">Пароль</span>
                <span class="password-field">
                    <input class="text-input" type="password" th:field="*{password}" required minlength="6">
                    <button class="icon-button password-toggle" type="button" aria-label="Показать пароль">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </span>
            </label>
            <label class="field-group">
                <span class="field-label">Повторите пароль</span>
                <span class="password-field">
                    <input class="text-input" type="password" th:field="*{passwordConfirmation}" required minlength="6">
                    <button class="icon-button password-toggle" type="button" aria-label="Показать пароль">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </span>
            </label>
            <label class="field-group">
                <span class="field-label">Имя пользователя</span>
                <input class="text-input" type="text" th:field="*{displayName}" required>
            </label>
            <label class="field-group">
                <span class="field-label">Email пользователя</span>
                <input class="text-input" type="email" th:field="*{email}" required>
            </label>

            <button class="btn form-wide" type="submit">Создать аккаунт</button>
        </form>

        <div class="auth-links">
            <a th:href="@{/login}">Уже есть аккаунт</a>
            <span>·</span>
            <a th:href="@{/}">Стартовая</a>
        </div>
    </section>
</main>
<script>
    document.querySelectorAll(".password-toggle").forEach((button) => {
        button.addEventListener("click", () => {
            const input = button.closest(".password-field").querySelector("input");
            input.type = input.type === "password" ? "text" : "password";
        });
    });
</script>
</body>
</html>
